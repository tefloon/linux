# Use stronger algorithms
cipher-algo AES256          # Encrypt data using AES with 256-bit keys (vs default AES128)
digest-algo SHA512          # Use SHA-512 for hashing (vs SHA-256 default)
cert-digest-algo SHA512     # Use SHA-512 when signing keys/certificates
compress-algo 2             # Use ZIP compression (0=none, 1=ZIP, 2=ZLIB, 3=BZIP2)

# Display preferences  
keyid-format 0xlong         # Show key IDs in long format (16 chars vs 8)
                           # Example: 0x1234567890ABCDEF vs 0x90ABCDEF

# Show fingerprints
with-fingerprint           # Always display full fingerprints when listing keys
                          # Fingerprints are more secure for key verification

# Character encoding
charset utf-8              # Handle international characters properly