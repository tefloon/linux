# Native PipeWire clients (mpv, Spotify) → Class-Audio sink.
# Read when each app starts, so restart the app after editing.
# See ../pipewire.conf.d/90-class-audio.conf for the whole setup.
stream.rules = [
    {   matches = [
            { application.name = "mpv" }
            { application.name = "Spotify" }
            { application.name = "Brave" }
        ]
        actions = {
            update-props = {
                target.object = "class_audio"
            }
        }
    }
]
