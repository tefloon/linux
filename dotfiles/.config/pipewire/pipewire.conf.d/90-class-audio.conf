# Class audio for Google Meet lessons.
#
#   headset mic ─────────────────────► meet_mix ──► Meet-Mic (pick this in Meet)
#   class_audio ──[waybar toggle]────► meet_mix
#   class_audio ─────────────────────► Headset (balanced) (you hear it, never yourself)
#
# The default output stays the raw Ryzen sink: the volume knob changes that,
# so the per-channel offsets on Headset (balanced) survive.
#
# Apps are sent to class_audio by ../client.conf.d/90-class-audio.conf (native: mpv, Spotify)
# and ../pipewire-pulse.conf.d/90-class-audio.conf (PulseAudio: Brave).
# The toggle (~/.config/waybar/scripts/classaudio-toggle.sh) loads/unloads
# a class_audio.monitor → meet_mix loopback at runtime.

context.objects = [
    # Sink the class-audio players play into.
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = class_audio
            node.description = "Class-Audio"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            monitor.channel-volumes = true
        }
    }
    # Internal mixing bus behind Meet-Mic. Don't play anything into it directly.
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = meet_mix
            node.description = "Meet-Mix (internal)"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
        }
    }
]

context.modules = [
    # Meet-Mic: the mix, exposed as a microphone.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Meet-Mic"
            capture.props = {
                node.name           = meet_mic.capture
                target.object       = meet_mix
                stream.capture.sink = true
                node.passive        = true
                node.dont-fallback  = true
                audio.position      = [ FL FR ]
            }
            playback.props = {
                node.name        = meet_mic
                node.description = "Meet-Mic"
                media.class      = Audio/Source
                audio.position   = [ FL FR ]
            }
        }
    }
    # Headset mic → mix.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Headset mic to Meet-Mix"
            capture.props = {
                node.name          = mic_to_meet.capture
                target.object      = "alsa_input.pci-0000_10_00.6.analog-stereo"
                node.passive       = true
                node.dont-fallback = true
            }
            playback.props = {
                node.name          = mic_to_meet.playback
                target.object      = meet_mix
                node.dont-fallback = true
            }
        }
    }
    # Class-Audio → Headset (balanced), so the music gets the L/R correction.
    # Falls back to the default output if the balance filter is gone.
    {   name = libpipewire-module-loopback
        args = {
            node.description = "Class-Audio to headset"
            capture.props = {
                node.name           = class_audio_listen.capture
                target.object       = class_audio
                stream.capture.sink = true
                node.passive        = true
                node.dont-fallback  = true
            }
            playback.props = {
                node.name     = class_audio_listen.playback
                target.object = effect_input.balance
            }
        }
    }
]
