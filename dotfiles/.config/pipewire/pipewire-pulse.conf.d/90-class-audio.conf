# PulseAudio clients (Brave; Spotify kept in case it falls back to Pulse) → Class-Audio sink.
# See ../pipewire.conf.d/90-class-audio.conf for the whole setup.
# Helium is deliberately absent: Meet runs there, and its output must not
# end up in the mix the students hear.
pulse.rules = [
    {   matches = [
            { application.name = "Spotify" }
            { application.name = "Brave" }
        ]
        actions = {
            update-props = {
                target.object = "class_audio"
            }
        }
    }
]
