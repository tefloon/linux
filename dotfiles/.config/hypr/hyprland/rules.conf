# ######## Window rules ########

windowrulev2=noblur,class:^()$,title:^()$
windowrulev2=float,class:^()$
windowrulev2=opaque,class:^()$,title:^()$

# Disable transparency for popup menus and dropdowns
windowrulev2 = opaque, title:^(menu)$
windowrulev2 = opaque, class:^(menu)$
windowrulev2 = noblur, class:^(menu)$
windowrulev2 = opaque, title:^(dropdown)$
windowrulev2 = opaque, class:^(dropdown)$
windowrulev2 = noblur, class:^(dropdown)$

# For more generic popup/menu matching
windowrulev2 = opaque, title:^(popup)$
windowrulev2 = opaque, class:^(popup)$
windowrulev2 = noblur, class:^(popup)$
windowrulev2 = opaque, title:^()$
windowrulev2 = noblur, title:^()$
windowrulev2 = opaque, class:^()$
windowrulev2 = noblur, class:^()$

# Match common menu window types
windowrulev2 = opaque, class:^(.*)(menu)(.*)$
windowrulev2 = noblur, class:^(.*)(menu)(.*)$
windowrulev2 = opaque, title:^(.*)(menu)(.*)$
windowrulev2 = noblur, title:^(.*)(menu)(.*)$

# For tooltips
windowrulev2 = opaque, class:^(tooltip)$
windowrulev2 = noblur, class:^(tooltip)$
windowrulev2 = opaque, title:^(tooltip)$
windowrulev2 = noblur, title:^(tooltip)$


# Uncomment to apply global transparency to all windows:
# windowrulev2 = opacity 0.89 override 0.89 override, class:.*

# Disable blur for xwayland context menus
windowrulev2 = noblur,class:^()$,title:^()$
windowrulev2 = opaque,class:^()$,title:^()$
windowrulev2 = noblur,title:^()$
windowrulev2 = opaque,title:^()$
windowrulev2 = noblur, xwayland:1
windowrulev2 = opaque, xwayland:1


# Floating
windowrulev2 = float, class:^(blueberry\.py)$
windowrulev2 = float, class:^(guifetch)$   # FlafyDev/guifetch
windowrulev2 = float, class:^(pavucontrol-qt)$
windowrulev2 = size 45%, class:^(pavucontrol-qt)$
windowrulev2 = center, class:^(pavucontrol-qt)$
windowrulev2 = float, class:^(org.pulseaudio.pavucontrol-qt)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = size 45%, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = float, class:.*plasmawindowed.*
windowrulev2 = float, class:kcm_.*
windowrulev2 = float, class:.*bluedevilwizard
windowrulev2 = float, title:.*Welcome
windowrulev2 = float, title:^(illogical-impulse Settings)$
windowrulev2 = float, class:org.freedesktop.impl.portal.desktop.kde
windowrulev2 = float, class:^(Zotero)$
windowrulev2 = size 45%, class:^(Zotero)$

# Picture-in-Picture
windowrulev2 = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = move 73% 72%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$ 
windowrulev2 = size 25%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrulev2 = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Dialog windows – float+center these windows.
windowrulev2 = center, title:^(Open File)(.*)$
windowrulev2 = center, title:^(Open folder)(.*)$
windowrulev2 = center, title:^(Select a File)(.*)$
windowrulev2 = center, title:^(Select Folder)(.*)$
windowrulev2 = center, title:^(Choose wallpaper)(.*)$
windowrulev2 = center, title:^(Open Folder)(.*)$
windowrulev2 = center, title:^(Save As)(.*)$
windowrulev2 = center, title:^(Library)(.*)$
windowrulev2 = center, title:^(File Upload)(.*)$
windowrulev2 = center, title:^(.*)(wants to save)$
windowrulev2 = center, title:^(.*)(wants to open)$
windowrulev2 = float, title:^(Open File)(.*)$
windowrulev2 = float, title:^(Select a File)(.*)$
windowrulev2 = float, title:^(Select Folder)(.*)$
windowrulev2 = float, title:^(Choose wallpaper)(.*)$
windowrulev2 = float, title:^(Open folder)(.*)$
windowrulev2 = float, title:^(Open Folder)(.*)$
windowrulev2 = float, title:^(Save As)(.*)$
windowrulev2 = float, title:^(Library)(.*)$
windowrulev2 = float, title:^(File Upload)(.*)$
windowrulev2 = float, title:^(.*)(wants to save)$
windowrulev2 = float, title:^(.*)(wants to open)$

# --- Tearing ---
windowrulev2 = immediate, title:.*\.exe
windowrulev2 = immediate, title:.*minecraft.*
windowrulev2 = immediate, class:^(steam_app).*

# No shadow for tiled windows (matches windows that are not floating).
windowrulev2 = noshadow, floating:0

# Launchers need to be FAST
layerrule = noanim, overlay

# ====================================
# ============ MY RULES ==============
# ====================================
windowrulev2 = float, class:^(org.gnome.Nautilus)$
windowrulev2 = float,class:^(com.github.hluk.copyq)$
windowrulev2 = float,class:^(brave)$                        # make brave file picker floar
windowrulev2 = float, class:^(Beyond-All-Reason)$,
windowrulev2 = float, class:^(mpv)$,

windowrulev2 = suppressevent maximize, class:.*             # Ignore maximize requests from apps


# ==== Floating windows ====
# float
windowrulev2 = float,class:^(org.kde.kdeconnect.app)$   
windowrulev2 = float,class:^(org.kde.kdeconnect.sms)$  
windowrulev2 = float, title:Steam Settings
windowrulev2 = float, class:^(org.gnome.Loupe)$
windowrulev2 = float, class:^(python3)$
windowrulev2 = float, class:^(org.qbittorrent.qBittorrent)$
windowrulev2 = float, class:^(calibre-gui)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, class:^(balena-etcher)$
windowrulev2 = float, class:^(unityhub)$
windowrulev2 = float, class:^(org.gnome.DiskUtility)$
windowrulev2 = float, class:^(virt-manager)$,title:^(Virtual Machine Manager)$

# sizes
windowrulev2 = size 45%,class:^(org.kde.kdeconnect.sms)$ 
windowrulev2 = size 45% ,class:^(org.kde.kdeconnect.app)$   
windowrulev2 = size 45%,class:^(org.gnome.Nautilus)$
windowrulev2 = size 35%,class:^(virt-manager)$,title:^(Virtual Machine Manager)$

# ==== Opacity ====
$opacity = 0.85

# per-window opacity - transparent
windowrulev2 = opacity $opacity, class:^(ferdium)$
windowrulev2 = opacity $opacity, class:^(kitty)$
windowrulev2 = opacity $opacity, class:^(sublime_text)$
windowrulev2 = opacity $opacity, class:^(code-oss)$
windowrulev2 = opacity $opacity, class:^(brave-browser-nightly)$
windowrulev2 = opacity $opacity, title:^(.*)$

windowrulev2 = immediate, class:^(obsidian)$
windowrulev2 = workspace special:magic, class:^(obsidian)$

windowrulev2 = opacity 1, title:.*YouTube.*


# per-window opacity - opaque
windowrulev2 = opaque, class:^(obsidian)$
windowrulev2 = opaque, class:^(ferdium)$

windowrulev2 = fullscreen, title:.*Slay the Spire.*
windowrulev2 = fullscreen, class:^(Kodi)$

layerrule = animation fade, wofi

# to get rid of animation artefacts on floating windows
windowrulev2 = opaque, floating:1
windowrulev2 = noblur, floating:1
windowrulev2 = noborder, floating:1

windowrulev2 = fullscreen, class::^(spring)$
windowrulev2 = fullscreen, class::^(Kodi)$

# autofocus
# Qwindowrulev2 = focusonactivate, class:^(brave-browser-nightly)$
windowrulev2 = focusonactivate, class:^(sublime_text)$
