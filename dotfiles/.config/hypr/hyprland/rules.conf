# ######## Window rules ########
windowrule = no_blur on, float on, opaque on, match:class ""

# Disable transparency for popup menus and dropdowns
windowrule = opaque on, no_blur on, match:title menu
windowrule = opaque on, no_blur on, match:class menu
windowrule = opaque on, no_blur on, match:title dropdown
windowrule = opaque on, no_blur on, match:class dropdown

# For more generic popup/menu matching
windowrule = opaque on, no_blur on, match:title popup
windowrule = opaque on, no_blur on, match:class popup
windowrule = opaque on, no_blur on, match:title "" 
windowrule = opaque on, no_blur on, match:class ""

# Match common menu window types
windowrule = opaque on, no_blur on, match:class .*(menu).*
windowrule = opaque on, no_blur on, match:title .*(menu).*

# For tooltips
windowrule = opaque on, no_blur on, match:class tooltip
windowrule = opaque on, no_blur on, match:title tooltip

# For modals
windowrule = opaque on, no_blur on,match:modal true

# Disable blur for xwayland context menus
windowrule = no_blur on, opaque on, match:xwayland true

# For images, videos and games
windowrule = no_blur on, opaque on, match:content 1
windowrule = no_blur on, opaque on,match:content 2
windowrule = no_blur on, opaque on, fullscreen on, fullscreen_state 3 3, match:content 3

# Floating
windowrule = float on, match:class blueberry\.py
windowrule = float on, match:class guifetch
windowrule = float on, match:class pavucontrol-qt
windowrule = size 600 300, match:class pavucontrol-qt
windowrule = center on, match:class pavucontrol-qt
windowrule = float on, match:class org.pulseaudio.pavucontrol-qt
windowrule = float on, match:class nm-connection-editor
windowrule = size 600 300, match:class nm-connection-editor
windowrule = center on, match:class nm-connection-editor
windowrule = float on, match:class .*plasmawindowed.*
windowrule = float on, match:class kcm_.*
windowrule = float on, match:class .*bluedevilwizard
windowrule = float on, match:title .*Welcome
windowrule = float on, match:title illogical-impulse Settings
windowrule = float on, match:class org.freedesktop.impl.portal.desktop.kde
windowrule = float on, match:class Zotero
windowrule = size 600 300, match:class Zotero

# Picture-in-Picture
windowrule = float on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = keep_aspect_ratio on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = move 73% 72%, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = size 25%, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = float on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*
windowrule = pin on, match:title [Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture.*

# Dialog windows – float+center these windows.
windowrule = center on, float on, match:title Open File.*
windowrule = center on, float on, match:title Open folder.*
windowrule = center on, float on, match:title Select a File.*
windowrule = center on, float on, match:title Select Folder.*
windowrule = center on, float on, match:title Choose wallpaper.*
windowrule = center on, float on, match:title Open Folder.*
windowrule = center on, float on, match:title Save As.*
windowrule = center on, float on, match:title Library.*
windowrule = center on, float on, match:title File Upload.*
windowrule = center on, float on, match:title .*(wants to save)
windowrule = center on, float on, match:title .*(wants to open)

# --- Tearing ---
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:title .*minecraft.*
windowrule = immediate on, match:class steam_app.*

# No shadow for tiled windows (matches windows that are not floating).
windowrule = no_shadow on, match:float false

# ====================================
# ============ MY RULES ==============
# ====================================
windowrule = float on, match:class org.gnome.Nautilus
windowrule = float on, match:class com.github.hluk.copyq
windowrule = float on, match:class brave
windowrule = float on, match:class Beyond-All-Reason
windowrule = float on, match:class mpv
windowrule = float on, match:class imv
windowrule = min_size 1 1, match:class com.gabm.satty


# ==== Floating windows ====
# float
windowrule = float on, match:class org.kde.kdeconnect.app
windowrule = float on, match:class org.kde.kdeconnect.sms
windowrule = float on, match:title Steam Settings
windowrule = float on, match:class org.gnome.Loupe
windowrule = float on, match:class python3
windowrule = float on, match:class org.qbittorrent.qBittorrent
windowrule = float on, match:class calibre-gui
windowrule = float on, match:class xdg-desktop-portal-gtk
windowrule = float on, match:class balena-etcher
windowrule = float on, match:class unityhub
windowrule = float on, match:class rustdesk
windowrule = float on, match:class org.gnome.DiskUtility
windowrule = float on, match:class virt-manager, match:title Virtual Machine Manager
windowrule = float on, match:title .*DevTools.*


# sizes
windowrule = size 900 700, center on, match:title .*DevTools.*
windowrule = size 45%, match:class org.kde.kdeconnect.sms
windowrule = size 45%, match:class org.kde.kdeconnect.app
windowrule = size 800 600, center on, match:class org.gnome.Nautilus
windowrule = size 35%, match:class virt-manager, match:title Virtual Machine Manager

# ==== Opacity ====
$opacity = 0.85

# per-window opacity - transparent
windowrule = opacity $opacity, match:class ferdium
windowrule = opacity $opacity, match:class kitty
windowrule = opacity $opacity, match:class sublime_text
windowrule = opacity $opacity, match:class code-oss
windowrule = opacity $opacity, match:class brave-browser-nightly
windowrule = opacity $opacity, match:title .*

windowrule = immediate on, match:class obsidian
windowrule = workspace special:magic, match:class obsidian

windowrule = opacity 1, match:title .*YouTube.*


# per-window opacity - opaque
windowrule = opaque on, match:class obsidian
windowrule = opaque on, match:class ferdium


# Float/center the Steam launcher
windowrule = float on, match:class steam, match:title .*Slay the Spire.*
windowrule = center on, match:class steam, match:title .*Slay the Spire.*

# Fullscreen the actual game windows (note the spaces in class names)
windowrule = fullscreen on, match:class Modded Slay the Spire
windowrule = fullscreen on, match:class Slay the Spire
windowrule = fullscreen on, match:class Kodi

layerrule = animation fade, match:namespace wofi
layerrule = no_anim on, match:namespace overlay

# to get rid of animation artefacts on floating windows
windowrule = opaque on, match:float true
windowrule = no_blur on, match:float true
windowrule = border_size 0, match:float true

windowrule = fullscreen on, match:class spring
windowrule = fullscreen on, match:class Kodi

# autofocus
# windowrule = focusonactivate, match:class brave-browser-nightly
windowrule = focus_on_activate on, match:class sublime_text
# windowrule = no_anim on, match:class Alacritty