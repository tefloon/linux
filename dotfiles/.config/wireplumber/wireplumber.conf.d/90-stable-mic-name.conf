# Give the onboard headset mic a stable node name: "headset_mic".
#
# The default name embeds the PCI address (alsa_input.pci-0000_XX_00.6...),
# which changed 10_00 -> 12_00 when the GPU went in and silently broke the
# class-audio mic loopback (~/.config/pipewire/pipewire.conf.d/90-class-audio.conf
# targets this name). Matching on the codec instead survives PCI renumbering.
monitor.alsa.rules = [
    {   matches = [
            {   node.name       = "~alsa_input.*"
                alsa.mixer_name = "Realtek ALC897"
            }
        ]
        actions = {
            update-props = {
                node.name = "headset_mic"
            }
        }
    }
]
