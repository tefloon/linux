# ~/.config/eza/theme.yml
# Color theme optimized for visibility through transparency

# Timestamp colors
date:
  foreground: "white"
  is_dimmed: true
  is_italic: true

users:
  user_you:
    foreground: "white"
    is_bold: false

filenames:
  "videos":
    icon:
      glyph: "󰿎"  
  "games":
    icon:
      glyph: "󰊗"
  "downloads":
    icon:
      glyph: ""
  "documents":
    icon:
      glyph: "󰲂"
  "music":
    icon:
      glyph: "󰝚"
  "linux":
    icon:
      glyph: ""
  "photos":
    icon:
      glyph: ""
  "mnt":
    icon:
      glyph: ""
  "projects":
    icon:
      glyph: ""

# Custom icons for specific file types
extensions:
  gitignore:
    icon:
      glyph: ""
  toml:
    icon:
      glyph: ""  
  yml:
    icon:
      glyph: ""
  mp4:
    icon:
      glyph: "󰿎"
  mkv:
    icon:
      glyph: "󰿎"
  avi:
    icon:
      glyph: "󰿎"
  mov:
    icon:
      glyph: "󰿎"
  webm:
    icon:
      glyph: "󰿎"  
  csv:
    icon:
      glyph: ""  
  xls:
    icon:
      glyph: "" 
  xlsx:
    icon:
      glyph: ""  
  doc:
    icon:
      glyph: ""
  docx:
    icon:
      glyph: ""

filekinds:
  executable:
    foreground: Green
    is_bold: false
  
  directory:
    foreground: Blue  # Matches Alacritty's blue (#0099FF)
    is_bold: true
  
  symlink:
    foreground: Cyan
    is_bold: true

file_type:
  # Archives in magenta (matches Alacritty's magenta)
  compressed:
    foreground: Yellow
    is_bold: false
  
  # Images in magenta
  image:
    foreground: Yellow
    is_bold: false
  
  # Videos in cyan
  video:
    foreground: Magenta
    is_bold: false

  # Audio in green
  music:
    foreground: Green
    is_bold: false
  
  # Documents in yellow
  document:
    foreground: White
    is_bold: false
  
  # Source code in green
  source:
    foreground: Green
    is_bold: false
