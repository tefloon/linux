# Foot terminal configuration
# Place this file at: ~/.config/foot/foot.ini

[main]
# Font configuration
font=monospace:size=16

# Padding (in pixels) - you can adjust these values as needed
# Format: horizontal vertical, or top right bottom left
pad=32x32  # 8 pixels horizontal, 8 pixels vertical

[cursor]
# Block cursor that blinks (classic style)
style=block
blink=no

[mouse]
# Hide mouse cursor when typing
hide-when-typing=yes

[colors]
# Using default colors - uncomment and customize if desired
# Or include a theme with: include=/usr/share/foot/themes/theme-name

# Example custom colors (commented out):
# foreground=dcdfe4
# background=282c34
# regular0=282c34  # black
# regular1=e06c75  # red
# regular2=98c379  # green
# regular3=e5c07b  # yellow
# regular4=61afef  # blue
# regular5=c678dd  # magenta
# regular6=56b6c2  # cyan
# regular7=dcdfe4  # white

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}