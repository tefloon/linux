# Place this file at: ~/.config/foot/foot.ini

[main]
# Font configuration
font=JetBrainsMono Nerd Font Propo:size=12

# Padding (in pixels) - you can adjust these values as needed
# Format: horizontal vertical, or top right bottom left
pad=32x24  # 8 pixels horizontal, 8 pixels vertical

[cursor]
# Block cursor without blinking
style=beam
blink=no

[mouse]
# Hide mouse cursor when typing
hide-when-typing=yes

[colors]
# Tokyo Night theme
foreground=c0caf5
background=1a1b26

## Normal/regular colors (color palette 0-7)
regular0=1e1e1e  # black
regular1=e06c75  # red (muted coral red)
regular2=98c379  # green (softer green)
regular3=e5c07b  # yellow (warmer, muted yellow)
regular4=61afef  # blue (softer blue)
regular5=bb9af7  # magenta (muted purple-magenta)
regular6=56b6c2  # cyan (muted cyan)
regular7=abb2bf  # white (softer white)

## Bright colors (color palette 8-15)
bright0=5c6370  # bright black
bright1=e06c75  # bright red
bright2=98c379  # bright green
bright3=e5c07b  # bright yellow
bright4=61afef  # bright blue
bright5=c678dd  # bright magenta (muted purple)
bright6=56b6c2  # bright cyan
bright7=d4d4d4  # bright white

[scrollback]
lines=10000

[url]
launch=xdg-open ${url}
