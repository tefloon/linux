# Faster startup
command_timeout = 500
scan_timeout = 10  # default is 30ms
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

# Format
format = """$directory\
$git_branch\
$character"""

[directory]
style = "bold blue" 
read_only = " 󰍁"
read_only_style = "dimmed bold blue"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[git_branch]
symbol = ""
style = "bold #ff6fef"  # Changed from purple to magenta for consistency

# [git_status]
# style = "bold yellow"
# format = '([\[$ahead_behind\]]($style) )'
# ahead = "⇡${count}"
# behind = "⇣${count}"
# diverged = "⇕⇡${ahead_count}⇣${behind_count}"
# untracked = "?"
# ignore_submodules = true

[package]
disabled = true  # Often slow, rarely useful
