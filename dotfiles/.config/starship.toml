# Faster startup
command_timeout = 500
scan_timeout = 50  # default is 30ms
"$schema" = 'https://starship.rs/config-schema.json'
add_newline = false

# Format
format = """$directory$git_branch${custom.python}\n$username$character"""

[directory]
style = "bold blue" 
read_only = " 󰍁"
read_only_style = "dimmed bold blue"
truncation_length = 3
truncate_to_repo = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[git_branch]
symbol = ""
style = "bold #ff6fef"  # Changed from purple to magenta for consistency

[custom.python]
command = 'basename "$VIRTUAL_ENV"'
when = '[[ -n "$VIRTUAL_ENV" ]]'
symbol = " "
style = "yellow"
format = "via [$symbol$output]($style) "

[package]
disabled = true  # Often slow, rarely useful
